<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基隆景點瀏覽器</title>
    <!-- 引入 Bootstrap 5 (僅借用排版網格系統) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入像素風字體作為點綴 -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar custom-navbar mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 pixel-title">Keelung Sights</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="text-center mb-5">
            <h2 class="mb-4 custom-title">選擇行政區</h2>
            <div class="d-flex flex-wrap justify-content-center gap-3" id="zone-buttons">
                <button class="custom-zone-btn" data-zone="中山區">中山區</button>
                <button class="custom-zone-btn" data-zone="信義區">信義區</button>
                <button class="custom-zone-btn" data-zone="仁愛區">仁愛區</button>
                <button class="custom-zone-btn" data-zone="中正區">中正區</button>
                <button class="custom-zone-btn" data-zone="安樂區">安樂區</button>
                <button class="custom-zone-btn" data-zone="七堵區">七堵區</button>
                <button class="custom-zone-btn" data-zone="暖暖區">暖暖區</button>
            </div>
        </div>

        <div id="loading" class="text-center d-none my-5 loading-text">
            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
            <span>正在讀取資料...</span>
        </div>

        <!-- 景點卡片容器 (RWD Grid) -->
        <div class="row g-4" id="sights-container">
            <!-- JavaScript 動態插入 -->
        </div>
    </div>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
