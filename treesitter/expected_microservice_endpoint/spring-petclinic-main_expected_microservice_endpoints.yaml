services:
  - name: pet-service
    basePath: /pets
    endpoints:
      - GET /pets
      - GET /pets/{petId}
      - POST /pets
      - PUT /pets/{petId}
      - DELETE /pets/{petId}

  - name: vet-service
    basePath: /vets
    endpoints:
      - GET /vets
      - GET /vets/{vetId}
      - POST /vets
      - PUT /vets/{vetId}
      - DELETE /vets/{vetId}

  - name: visit-service
    basePath: /visits
    endpoints:
      - GET /visits
      - GET /visits/{visitId}
      - POST /visits
      - PUT /visits/{visitId}
      - DELETE /visits/{visitId}

  - name: customer-service
    basePath: /customer
    endpoints:
      - GET /owners
      - GET /owners/{ownerId}
      - POST /owners
      - PUT /owners/{ownerId}
      - DELETE /owners/{ownerId}
      - GET /owners/{ownerId}/pets